<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K8s Learning Tracker</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #111827;
    --border: #1e293b;
    --primary: #38bdf8;
    --primary-dim: rgba(56,189,248,0.1);
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --completed: #1a3a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: clamp(1.8rem,4vw,2.8rem);
    font-weight: 800;
    background: linear-gradient(135deg,#38bdf8,#818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Progress Overview */
  .progress-overview {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .progress-bar-outer {
    height: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#38bdf8,#818cf8);
    border-radius: 10px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .progress-stats span { font-weight: 700; color: var(--primary); }

  /* Month Tabs */
  .month-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 20px;
    scrollbar-width: thin;
  }
  .month-tab {
    flex-shrink: 0;
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    color: var(--muted);
  }
  .month-tab:hover { border-color: var(--primary); color: var(--text); }
  .month-tab.active {
    border-color: var(--primary);
    background: var(--primary-dim);
    color: var(--primary);
  }
  .month-tab .tab-progress {
    display: inline-block;
    width: 40px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .month-tab .tab-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* Month Card */
  .month-card {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    animation: fadeIn 0.3s ease;
  }
  .month-card.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .month-header h2 { font-size: 1.4rem; }
  .difficulty {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .difficulty.beginner { background: rgba(34,197,94,0.15); color: var(--green); }
  .difficulty.intermediate { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .difficulty.advanced { background: rgba(239,68,68,0.15); color: var(--red); }

  .month-progress {
    margin-bottom: 20px;
    padding: 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
  }
  .month-progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  .month-progress-fill {
    height: 100%;
    background: linear-gradient(90deg,#38bdf8,#818cf8);
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .month-progress-text { font-size: 0.85rem; color: var(--muted); }

  /* Week sections */
  .week {
    margin-bottom: 16px;
  }
  .week h3 {
    font-size: 1rem;
    color: var(--primary);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .task-list { list-style: none; }
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .task-item:hover { background: rgba(255,255,255,0.03); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-checkbox {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 2px solid var(--muted);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 11px;
  }
  .task-item.done .task-checkbox {
    background: var(--green);
    border-color: var(--green);
  }
  .task-item.done .task-checkbox::after { content: '✓'; color: #fff; }
  .task-text { flex: 1; font-size: 0.9rem; line-height: 1.5; }
  .task-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* Lab box */
  .lab-box {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(129,140,248,0.08);
    border: 1px solid rgba(129,140,248,0.2);
    border-radius: 8px;
  }
  .lab-box h4 { color: #818cf8; margin-bottom: 6px; font-size: 0.9rem; }
  .lab-box p { font-size: 0.85rem; color: var(--text); line-height: 1.6; }

  /* Reset button */
  .reset-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  .footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  .footer a { color: var(--primary); text-decoration: none; }

  @media (max-width: 640px) {
    .container { padding: 12px; }
    .month-card { padding: 16px; }
    .month-tab { font-size: 0.78rem; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>☸ Kubernetes 学习追踪器</h1>
  <p>6 个月从入门到精通 · 每日 2 小时 · 点击复选框记录进度</p>
</div>

<div class="container">
  <div class="progress-overview">
    <div style="display:flex;justify-content:space-between;">
      <strong>总进度</strong>
      <span id="overall-count">0 / 0</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="overall-bar"></div>
    </div>
    <div class="progress-stats">
      <span>总体完成度</span>
      <span id="overall-pct">0%</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="month-tabs" id="monthTabs"></div>

  <!-- Cards -->
  <div id="cardsContainer"></div>

  <button class="reset-btn" onclick="resetAll()">🗑 重置所有进度</button>
</div>

<div class="footer">
  <a href="https://github.com/yt-huang/k8s-learning-tracker" target="_blank">📦 GitHub</a>
  · Made with ❤️
</div>

// ======================================================================
// APP
// ======================================================================
function build() {
  const tabs = document.getElementById('monthTabs');
  const cards = document.getElementById('cardsContainer');
  const totalTasks = MONTHS.reduce((s, m) => s + m.weeks.reduce((ss, w) => ss + w.tasks.length, 0), 0);

  MONTHS.forEach((month, mi) => {
    // Tab
    const tab = document.createElement('div');
    tab.className = 'month-tab' + (mi === 0 ? ' active' : '');
    tab.dataset.month = mi;
    tab.innerHTML = `M${month.id} ${month.title} <span class="tab-progress"><span class="tab-progress-fill" id="tabFill${mi}" style="width:0%"></span></span>`;
    tab.onclick = () => switchMonth(mi);

    // Count tasks in this month
    const totalInMonth = month.weeks.reduce((s, w) => s + w.tasks.length, 0);

    // Card
    const card = document.createElement('div');
    card.className = 'month-card' + (mi === 0 ? ' active' : '');
    card.id = `card${mi}`;

    let html = `
      <div class="month-header">
        <h2>第 ${month.id} 月：${month.title}</h2>
        <span class="difficulty ${month.diff}">${month.diffLabel}</span>
      </div>
      <div class="month-progress">
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
          <span>本月进度</span>
          <span id="mProgress${mi}">0 / ${totalInMonth}</span>
        </div>
        <div class="month-progress-bar">
          <div class="month-progress-fill" id="mBar${mi}" style="width:0%"></div>
        </div>
        <div class="month-progress-text" id="mPct${mi}">0%</div>
      </div>`;

    month.weeks.forEach((week, wi) => {
      html += `<div class="week"><h3>${week.name}</h3><ul class="task-list">`;
      week.tasks.forEach((task, ti) => {
        const key = `${mi}-${wi}-${ti}`;
        html += `<li class="task-item" data-key="${key}" onclick="toggleTask('${key}')">
          <span class="task-checkbox"></span>
          <span class="task-text">${task}</span>
        </li>`;
      });
      html += `</ul></div>`;
    });

    html += `<div class="lab-box"><h4>🧪 本月项目实战</h4><p>${month.lab}</p></div>`;
    card.innerHTML = html;
    cards.appendChild(card);
    tabs.appendChild(tab);
  });

  // Setup
  window._totalTasks = totalTasks;
  loadState();
  updateAll();
}

// ======================================================================
// State Management
// ======================================================================
function getKey() { return 'k8s-tracker-v1'; }
function getDone() {
  try { return JSON.parse(localStorage.getItem(getKey()) || '{}'); } catch { return {}; }
}
function saveDone(d) { localStorage.setItem(getKey(), JSON.stringify(d)); }

function toggleTask(key) {
  const d = getDone();
  d[key] = !d[key];
  if (!d[key]) delete d[key];
  saveDone(d);
  const el = document.querySelector(`[data-key="${key}"]`);
  if (el) el.classList.toggle('done', d[key]);
  updateAll();
}

function loadState() {
  const d = getDone();
  document.querySelectorAll('.task-item').forEach(el => {
    const k = el.dataset.key;
    if (d[k]) el.classList.add('done');
  });
}

function resetAll() {
  if (!confirm('确定要重置所有进度吗？')) return;
  localStorage.removeItem(getKey());
  document.querySelectorAll('.task-item').forEach(el => el.classList.remove('done'));
  updateAll();
}

// ======================================================================
// Update UI
// ======================================================================
function updateAll() {
  const d = getDone();
  let overallDone = 0;
  const total = window._totalTasks || 1;

  MONTHS.forEach((month, mi) => {
    let monthDone = 0;
    let monthTotal = 0;
    month.weeks.forEach((week, wi) => {
      week.tasks.forEach((_, ti) => {
        monthTotal++;
        if (d[`${mi}-${wi}-${ti}`]) monthDone++;
      });
    });
    overallDone += monthDone;

    // Month progress
    const pct = monthTotal > 0 ? (monthDone / monthTotal * 100) : 0;
    const mBar = document.getElementById(`mBar${mi}`);
    const mPct = document.getElementById(`mPct${mi}`);
    const mProgress = document.getElementById(`mProgress${mi}`);
    const tabFill = document.getElementById(`tabFill${mi}`);
    if (mBar) mBar.style.width = `${pct}%`;
    if (mPct) mPct.textContent = `${Math.round(pct)}%`;
    if (mProgress) mProgress.textContent = `${monthDone} / ${monthTotal}`;
    if (tabFill) tabFill.style.width = `${pct}%`;
  });

  // Overall
  const overallPct = total > 0 ? (overallDone / total * 100) : 0;
  const bar = document.getElementById('overall-bar');
  const count = document.getElementById('overall-count');
  const pctEl = document.getElementById('overall-pct');
  if (bar) bar.style.width = `${overallPct}%`;
  if (count) count.textContent = `${overallDone} / ${total}`;
  if (pctEl) pctEl.textContent = `${Math.round(overallPct)}%`;
}

// ======================================================================
// Tabs
// ======================================================================
function switchMonth(idx) {
  document.querySelectorAll('.month-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.month-card').forEach((c, i) => c.classList.toggle('active', i === idx));
}

// ======================================================================
// Init
// ======================================================================
document.addEventListener('DOMContentLoaded', build);
</script>
